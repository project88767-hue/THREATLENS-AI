# Render Blueprint: deploys the whole THREATLENS AI platform on the free plan.
# Render Dashboard -> New -> Blueprint -> pick this repo -> fill in the prompted values.
databases:
  - name: threatlens-db
    plan: free
    databaseName: threatlens
    user: threatlens

envVarGroups:
  - name: threatlens-shared
    envVars:
      # Auto-generated once and shared by the web service and the engine.
      - key: INTERNAL_ENGINE_KEY
        generateValue: true

services:
  # ---- Python analysis engine (talks to VirusTotal, AbuseIPDB, NVD, the LLM, ...) ----
  - type: web
    name: threatlens-engine
    runtime: docker
    plan: free
    dockerfilePath: ./analysis-engine/Dockerfile
    dockerContext: ./analysis-engine
    healthCheckPath: /health
    envVars:
      - fromGroup: threatlens-shared
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_LIVE_PUBLIC_LOOKUPS
        value: "true"
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: AI_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        sync: false
      - key: ABUSEIPDB_API_KEY
        sync: false
      - key: ALIENVAULT_OTX_API_KEY
        sync: false
      - key: NVD_API_KEY
        sync: false

  # ---- Website + API (React app and Express API served from one container) ----
  - type: web
    name: threatlens-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - fromGroup: threatlens-shared
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: threatlens-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Paste the engine's public URL here after the first deploy, e.g. https://threatlens-engine-xxxx.onrender.com
      - key: ANALYSIS_ENGINE_URL
        sync: false
      # Creates your admin account on first start (the public sign-up only makes analysts).
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
